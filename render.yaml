services:
  - type: web
    name: lead-tracker-api
    runtime: python
    plan: free

    region: oregon

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
